[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

# This tells pip to ONLY look for the python folder
[tool.setuptools]
packages = ["python"]

# This maps the package name "python" to the folder "python"
[tool.setuptools.package-dir]
"python" = "."

[project]
name = "DOA"
version = "0.1.0"
dependencies = ["ctREFPROP", "coolprop", "h5py"]